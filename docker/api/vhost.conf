<VirtualHost *:80>

    ServerName localhost

    DocumentRoot /var/www/webadmin-api/public

    <Directory /var/www/webadmin-api/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php

    ErrorLog ${APACHE_LOG_DIR}/webadmin-api-error.log
    CustomLog ${APACHE_LOG_DIR}/webadmin-api-access.log combined

</VirtualHost>
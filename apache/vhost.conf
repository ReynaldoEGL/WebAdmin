<VirtualHost *:80>

    ServerName webadmin.local

    DocumentRoot /var/www/webadmin/public

    <Directory /var/www/webadmin/public>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/webadmin/config>
        Require all denied
    </Directory>

    <Directory /var/www/webadmin/src>
        Require all denied
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <Location /server-status>
        SetHandler server-status
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/webadmin_error.log
    CustomLog ${APACHE_LOG_DIR}/webadmin_access.log combined

</VirtualHost>
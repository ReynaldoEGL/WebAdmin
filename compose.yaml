name: webadmin

services:

  web:
    build:
      context: .
      dockerfile: apache/Dockerfile

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      db:
        condition: service_healthy

    secrets:
      - db_password

    restart: unless-stopped

  db:
    image: mariadb:11.4.12

    environment:
      MARIADB_DATABASE: webadmin_db
      MARIADB_USER: webadmin_user
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password

    secrets:
      - db_password
      - db_root_password

    volumes:
      - webadmin_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1

    ports:
      - "127.0.0.1:9100:9100"

    restart: unless-stopped

  apache-exporter:
    image: lusotycoon/apache-exporter:latest

    command:
      - '--scrape_uri=http://web/server-status?auto'

    depends_on:
      - web

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - node-exporter
      - apache-exporter

    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  webadmin_db_data:
  prometheus_data:
  grafana_data:


secrets:

  db_password:
    file: ./secrets/db_password.txt

  db_root_password:
    file: ./secrets/db_root_password.txt